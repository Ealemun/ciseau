[project]
name = "ciseau"
version = "0.1.0"
description = "Télécharge un extrait précis de n'importe quelle vidéo (YouTube et 1800+ sites) entre deux timecodes."
readme = "README.md"
requires-python = ">=3.10"
# yt-dlp fait tout le travail de résolution/téléchargement ; ffmpeg doit être installé à part.
dependencies = ["yt-dlp>=2025.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
# Après `pip install .`, la commande `ciseau` pointe sur ciseau/cli.py:main
ciseau = "ciseau.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ciseau*"]

[tool.setuptools.package-data]
# La page de l'interface web est embarquée dans le paquet.
ciseau = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
